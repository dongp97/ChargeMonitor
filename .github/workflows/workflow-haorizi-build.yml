name: HaoRiZi Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'haorizi/**'
      - '.github/workflows/haorizi-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve SDK path and accept licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK/licenses/android-sdk-preview-license"
          echo "SDK path: $SDK"

      - name: Install SDK packages
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --install "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "sdkmanager 不存在，交给 AGP 自动下载（license 已写入）"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-haorizi-${{ hashFiles('haorizi/**/*.gradle*', 'haorizi/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-haorizi-

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q gradle-8.9-bin.zip -d /opt
          sudo ln -sfn /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build Debug APK
        run: gradle -p haorizi --no-daemon --stacktrace assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: haorizi-apk
          path: haorizi/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 30
